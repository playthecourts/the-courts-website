<button type="button" class="cart-toggle" id="cartToggle" aria-haspopup="dialog" aria-controls="cartDrawer">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8h12l-1.2 11a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  Bag
  <span class="cart-toggle-count" id="cartCount">0</span>
</button>

<div class="cart-overlay" id="cartOverlay" hidden></div>
<aside class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Your bag" tabindex="-1">
  <div class="cart-drawer-head">
    <h2>Your Bag</h2>
    <button type="button" class="cart-drawer-close" id="cartDrawerClose" aria-label="Close bag">&times;</button>
  </div>
  <div class="cart-drawer-items" id="cartDrawerItems" aria-live="polite">
    <p class="cart-drawer-empty" id="cartDrawerEmpty">Your bag is empty.</p>
  </div>
  <div class="cart-drawer-foot">
    <div class="cart-drawer-subtotal"><span>Subtotal</span><strong id="cartSubtotal">$0</strong></div>
    <button type="button" class="btn btn-secondary btn-block" id="cartViewBag">View Bag</button>
    <button type="button" class="btn btn-primary btn-block" id="cartCheckout" style="margin-top:10px;">Checkout →</button>
  </div>
</aside>

<script>
(function () {
  var cart = [];

  function money(n) { return '$' + n.toFixed(0); }

  function findLine(id) {
    for (var i = 0; i < cart.length; i++) { if (cart[i].id === id) return cart[i]; }
    return null;
  }

  function addToCart(item) {
    var id = item.name + '|' + (item.variant || '');
    var existing = findLine(id);
    if (existing) { existing.qty += 1; }
    else { cart.push({ id: id, name: item.name, variant: item.variant || '', price: item.price, qty: 1 }); }
    render();
    openDrawer();
  }

  function removeLine(id) { cart = cart.filter(function (l) { return l.id !== id; }); render(); }
  function changeQty(id, delta) {
    var l = findLine(id);
    if (!l) return;
    l.qty += delta;
    if (l.qty <= 0) removeLine(id); else render();
  }

  function render() {
    var itemsEl = document.getElementById('cartDrawerItems');
    var countEl = document.getElementById('cartCount');
    var subtotalEl = document.getElementById('cartSubtotal');
    var totalQty = 0, subtotal = 0;
    itemsEl.innerHTML = '';
    if (cart.length === 0) {
      var p = document.createElement('p');
      p.className = 'cart-drawer-empty';
      p.id = 'cartDrawerEmpty';
      p.textContent = 'Your bag is empty.';
      itemsEl.appendChild(p);
    } else {
      cart.forEach(function (l) {
        totalQty += l.qty;
        subtotal += l.qty * l.price;
        var row = document.createElement('div');
        row.className = 'cart-line';
        row.innerHTML =
          '<div class="cart-line-media"><div class="photo" role="img" aria-label=""></div></div>' +
          '<div class="cart-line-body">' +
            '<p class="cart-line-name">' + l.name + '</p>' +
            (l.variant ? '<p class="cart-line-variant">Size ' + l.variant + '</p>' : '') +
            '<div class="cart-line-row">' +
              '<span class="cart-line-qty">' +
                '<button type="button" data-action="dec" aria-label="Decrease quantity">−</button>' +
                '<span>' + l.qty + '</span>' +
                '<button type="button" data-action="inc" aria-label="Increase quantity">+</button>' +
              '</span>' +
              '<span class="cart-line-price">' + money(l.qty * l.price) + '</span>' +
            '</div>' +
            '<button type="button" class="cart-line-remove" data-action="remove">Remove</button>' +
          '</div>';
        row.querySelector('[data-action="dec"]').addEventListener('click', function () { changeQty(l.id, -1); });
        row.querySelector('[data-action="inc"]').addEventListener('click', function () { changeQty(l.id, 1); });
        row.querySelector('[data-action="remove"]').addEventListener('click', function () { removeLine(l.id); });
        itemsEl.appendChild(row);
      });
    }
    countEl.textContent = totalQty;
    subtotalEl.textContent = money(subtotal);
  }

  function openDrawer() {
    document.getElementById('cartDrawer').classList.add('open');
    document.getElementById('cartOverlay').hidden = false;
    requestAnimationFrame(function () { document.getElementById('cartOverlay').classList.add('open'); });
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    document.getElementById('cartDrawer').classList.remove('open');
    document.getElementById('cartOverlay').classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { document.getElementById('cartOverlay').hidden = true; }, 300);
  }

  document.getElementById('cartToggle').addEventListener('click', openDrawer);
  document.getElementById('cartDrawerClose').addEventListener('click', closeDrawer);
  document.getElementById('cartOverlay').addEventListener('click', closeDrawer);
  document.getElementById('cartViewBag').addEventListener('click', openDrawer);
  document.getElementById('cartCheckout').addEventListener('click', function () { openDrawer(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.getElementById('cartDrawer').classList.contains('open')) closeDrawer();
  });

  document.querySelectorAll('.shop-add').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var name = btn.getAttribute('data-name');
      var price = parseFloat(btn.getAttribute('data-price') || '0');
      var variantGroup = btn.getAttribute('data-variant-group');
      var priceSource = btn.getAttribute('data-price-source');
      var variant = null;

      if (priceSource) {
        var checked = document.querySelector('input[name="' + priceSource + '"]:checked');
        price = checked ? parseFloat(checked.value) : 0;
        name = name + ' ($' + price.toFixed(0) + ')';
      }

      if (variantGroup) {
        var picked = document.querySelector('input[name="' + variantGroup + '"]:checked');
        if (!picked) {
          var fieldset = document.querySelector('fieldset[data-required="true"] input[name="' + variantGroup + '"]');
          if (fieldset) fieldset.focus();
          btn.classList.remove('shake');
          void btn.offsetWidth;
          btn.classList.add('shake');
          btn.setAttribute('aria-describedby', variantGroup + '-hint');
          var hint = document.getElementById(variantGroup + '-hint');
          if (!hint) {
            hint = document.createElement('span');
            hint.id = variantGroup + '-hint';
            hint.className = 'sr-only';
            hint.setAttribute('role', 'alert');
            hint.textContent = 'Please select a size first.';
            btn.parentNode.appendChild(hint);
          }
          return;
        }
        variant = picked.value;
      }

      addToCart({ name: name, price: price, variant: variant });
    });
  });

  document.querySelectorAll('.shop-filters .filter-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      document.querySelectorAll('.shop-filters .filter-pill').forEach(function (p) { p.classList.remove('active'); });
      pill.classList.add('active');
    });
  });
})();
</script>
